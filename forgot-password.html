<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — AquaGuard</title>
  <meta name="description" content="Reset your AquaGuard account password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-50: #eff6ff; --blue-400: #60a5fa; --blue-500: #3b82f6; --blue-600: #2563eb;
      --cyan-500: #06b6d4; --text-primary: #0f172a; --text-secondary: #475569;
      --text-muted: #94a3b8; --border: #dbeafe; --surface: #ffffff; --bg: #f0f7ff;
      --radius: 16px; --radius-sm: 10px;
    }
    html, body { min-height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; }

    .fp-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 32px rgba(59,130,246,0.12);
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fp-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .fp-logo-icon { width: 38px; height: 38px; background: linear-gradient(135deg,#38bdf8,#0ea5e9); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .fp-logo-text { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 800; color: var(--text-primary); }

    .fp-icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
    .fp-title { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; text-align: center; }
    .fp-sub { font-size: 13.5px; color: var(--text-muted); text-align: center; line-height: 1.6; margin-bottom: 28px; }

    .fp-form { display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .input-wrap { position: relative; }
    .input-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 16px; pointer-events: none; }
    .form-input { width: 100%; padding: 11px 13px 11px 40px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 13.5px; font-family: 'Inter',sans-serif; color: var(--text-primary); transition: all 0.2s; outline: none; }
    .form-input:focus { border-color: var(--blue-400); background: white; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    .form-input::placeholder { color: var(--text-muted); }

    .auth-msg { display: none; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; align-items: center; gap: 8px; margin-bottom: 4px; }
    .auth-msg.error { display: flex; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .auth-msg.success { display: flex; background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }

    .submit-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--blue-500), var(--cyan-500)); border: none; border-radius: var(--radius-sm); color: white; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: 'Inter',sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .spinner { width: 17px; height: 17px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    .submit-btn.loading .spinner { display: block; }

    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-muted); text-decoration: none; }
    .back-link:hover { color: var(--blue-600); }
  </style>
</head>
<body>
  <div class="fp-card">
    <div class="fp-logo">
      <div class="fp-logo-icon"><svg width="22" height="22" viewBox="0 0 28 28" fill="none"><path d="M14 2C14 2 4 10.5 4 17a10 10 0 0020 0C24 10.5 14 2 14 2z" fill="white" fill-opacity="0.9"/><path d="M10 18.5a5 5 0 006 0" stroke="rgba(59,130,246,0.8)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <span class="fp-logo-text">AquaGuard</span>
    </div>

    <div class="fp-icon">🔑</div>
    <div class="fp-title">Forgot Password?</div>
    <p class="fp-sub">No worries! Enter your registered email address and we'll send you a reset link.</p>

    <div class="auth-msg" id="fp-msg"></div>

    <form class="fp-form" onsubmit="handleReset(event)">
      <div class="form-group">
        <label class="form-label" for="fp-email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input type="email" class="form-input" id="fp-email" placeholder="you@example.com" required />
        </div>
      </div>
      <button type="submit" class="submit-btn" id="fp-btn">
        <div class="spinner"></div>
        <span id="fp-btn-text">Send Reset Link →</span>
      </button>
    </form>

    <a href="login.html" class="back-link">← Back to Sign In</a>
  </div>

  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('fp-email').value.trim();
      const btn = document.getElementById('fp-btn');
      const msg = document.getElementById('fp-msg');
      msg.className = 'auth-msg'; msg.textContent = '';
      if (!email) { msg.className='auth-msg error'; msg.textContent='⚠️ Please enter your email address.'; return; }
      btn.classList.add('loading');
      document.getElementById('fp-btn-text').textContent = 'Sending…';
      setTimeout(() => {
        btn.classList.remove('loading');
        msg.className = 'auth-msg success';
        msg.textContent = `✅ Reset link sent to ${email}. Check your inbox (and spam folder).`;
        document.getElementById('fp-btn-text').textContent = '✅ Email Sent';
        btn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
      }, 1800);
    }
  </script>
</body>
</html>
